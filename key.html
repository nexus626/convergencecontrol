<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convergence Key</title><style>
:root{--bg:#02040a;--panel:rgba(5,11,24,.82);--line:rgba(140,200,255,.22);--accent:#9fd8ff;--text:#eef7ff;--muted:#7d93aa;--ok:#a5ffd6;--bad:#ff6b7a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at center,#0a1830 0,#02040a 46%,#010207 100%);color:var(--text);font-family:"Courier New",monospace}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px);background-size:95px 95px}
.screen{min-height:100vh;padding:26px 34px;display:grid;grid-template-rows:auto 1fr auto}
header,footer{display:flex;justify-content:space-between;border-color:var(--line)}header{border-bottom:1px solid var(--line);padding-bottom:14px}footer{border-top:1px solid var(--line);padding-top:12px;font-size:10px;color:var(--muted)}
header h2{letter-spacing:.25em;margin:8px 0 0;font-size:22px}header small,.right small{color:var(--muted);font-size:15px;letter-spacing:.08em}.right{text-align:right}.right b{display:block;color:var(--accent);margin-top:8px;font-size:20px}
main{display:grid;grid-template-columns:230px 1fr 230px;gap:28px;align-items:center}aside{color:var(--muted);font-size:14px;line-height:1.9}aside p{border-left:1px solid var(--line);padding-left:14px;margin:28px 0}aside b{color:var(--accent);font-weight:normal;font-size:18px;display:inline-block;margin-top:2px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:660px;justify-content:center}
.cosmos{width:390px;height:390px;position:relative;display:grid;place-items:center}.ring{position:absolute;border:1px solid rgba(140,200,255,.48);border-radius:50%}.r1{width:355px;height:355px;animation:spin 32s linear infinite}.r2{width:280px;height:280px;border-style:dashed;animation:spinR 22s linear infinite}.r3{width:205px;height:205px;animation:spin 15s linear infinite}.core{width:94px;height:94px;border-radius:50%;background:radial-gradient(circle,#fff 0,#aee6ff 22%,rgba(65,140,255,.7) 48%,transparent 74%);filter:drop-shadow(0 0 22px #64bfff);animation:pulse 3.2s ease-in-out infinite}
.center>small{letter-spacing:.28em;color:var(--muted);font-size:14px}.center>h1{letter-spacing:.16em;font-weight:400;margin:14px 0 10px;font-size:54px;line-height:1.12}.center>p{color:var(--accent);letter-spacing:.15em;font-size:16px;margin:0 0 6px}
.status{display:grid;grid-template-columns:repeat(3,1fr);width:min(860px,96vw);margin-top:28px;border:1px solid var(--line);background:rgba(3,9,20,.58)}.status div{padding:18px 20px;border-right:1px solid var(--line)}.status div:last-child{border-right:0}.status small{display:block;color:var(--muted);font-size:12px;letter-spacing:.08em}.status b{display:block;color:var(--ok);margin-top:8px;font-size:20px;font-weight:normal;letter-spacing:.04em}
.panel{width:min(900px,96vw);margin-top:18px;padding:22px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(9px);font-size:16px}.row{display:flex;gap:10px}input{flex:1;background:#02060e;border:1px solid rgba(140,200,255,.5);color:var(--text);padding:14px 16px;text-transform:uppercase;font-size:16px}button{background:#09172d;color:var(--accent);border:1px solid rgba(140,200,255,.5);padding:14px 16px;cursor:pointer;font:inherit;font-size:16px}button:hover{border-color:var(--accent);color:#fff}.wide{width:100%;margin-top:12px}.hidden{display:none!important}.timer{font-size:68px;color:var(--bad);margin:8px 0 18px}.timelineGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.timelineGrid button small{display:block;color:var(--muted);margin-top:7px;font-size:13px}
body.cascade .core{background:radial-gradient(circle,#fff 0,#ffbac2 22%,rgba(255,65,92,.7) 48%,transparent 74%);filter:drop-shadow(0 0 25px #ff5368)}body.cascade .ring{border-color:rgba(255,90,110,.55)}
.master{padding:40px 20px}.masterWrap{width:min(900px,100%);margin:auto;position:relative;z-index:1}.masterGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.masterGrid button{min-height:58px}.master label{display:block;color:var(--muted);font-size:10px;margin:12px 0 6px}.master input{width:100%}.danger{color:var(--bad);border-color:rgba(255,107,122,.6)}.success{color:var(--ok);border-color:rgba(165,255,214,.6)}a{color:var(--accent)}.key{max-width:560px;margin:10vh auto;text-align:center}.mini{border:1px solid var(--line);padding:14px;margin:20px auto;width:220px}.mini small{display:block;color:var(--muted)}.mini b{color:var(--accent)}.dangerText{color:var(--bad)}.successText{color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}@keyframes pulse{0%,100%{transform:scale(.95)}50%{transform:scale(1.08)}}
@media(max-width:900px){main{grid-template-columns:1fr}aside{display:none}.timelineGrid{grid-template-columns:repeat(2,1fr)}.cosmos{width:310px;height:310px}.r1{width:290px;height:290px}.r2{width:230px;height:230px}.r3{width:170px;height:170px}.masterGrid{grid-template-columns:1fr}.center>h1{font-size:36px}.center>p{font-size:14px}.status{width:min(96vw,96vw)}.status b{font-size:16px}}
</style></head><body class="master"><div class="key panel"><small>CONVERGENCE KEY</small><h1 id="keyTitle">CLEARANCE ACTIVE</h1><p id="keyText">Variant access verified. Convergence coverage confirmed.</p><div class="mini"><small>KEY ID</small><b id="keyId">CX-KEY</b></div><div id="emergency" class="hidden dangerText"><h2>⚠ CLEARANCE REVOKED</h2><p>CASCADE FAILURE DETECTED. Retrieve DOSSIER III and report to the Control Station.</p></div><div id="restored" class="hidden successText"><h2>CLEARANCE RESTORED</h2><p>Distributed Convergence stable.</p></div></div><script>const C={defaultState:"WELCOME",phase1Code:"AR-4721",phase2Code:"NOVA-2974",finalCommand:"STABILIZE ALL TIMELINES",cascadeMinutes:10};</script><script>
const $=id=>document.getElementById(id);$("keyId").textContent=(new URLSearchParams(location.search).get("key")||"CX-KEY").toUpperCase();
function render(){let s=localStorage.getItem("convergenceState")||C.defaultState;$("emergency").classList.add("hidden");$("restored").classList.add("hidden");if(s==="CASCADE"){$("keyTitle").textContent="CLEARANCE REVOKED";$("keyText").textContent="Emergency protocol activated.";$("emergency").classList.remove("hidden")}else if(s==="RESOLVED"){$("keyTitle").textContent="CLEARANCE RESTORED";$("keyText").textContent="Variant access verified.";$("restored").classList.remove("hidden")}else if(s==="CLEARED"||s==="PROVISIONAL"){$("keyTitle").textContent="CLEARANCE APPROVED";$("keyText").textContent="Convergence stable. No action required."}else{$("keyTitle").textContent="CLEARANCE ACTIVE";$("keyText").textContent="Variant access verified. Convergence coverage confirmed."}}window.addEventListener("storage",render);render();
</script></body></html>
