<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Control</title><style>
:root{--bg:#02040a;--panel:rgba(5,11,24,.82);--line:rgba(140,200,255,.22);--accent:#9fd8ff;--text:#eef7ff;--muted:#7d93aa;--ok:#a5ffd6;--bad:#ff6b7a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at center,#0a1830 0,#02040a 46%,#010207 100%);color:var(--text);font-family:"Courier New",monospace}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px);background-size:95px 95px}
.screen{min-height:100vh;padding:26px 34px;display:grid;grid-template-rows:auto 1fr auto}
header,footer{display:flex;justify-content:space-between;border-color:var(--line)}header{border-bottom:1px solid var(--line);padding-bottom:14px}footer{border-top:1px solid var(--line);padding-top:12px;font-size:10px;color:var(--muted)}
header h2{letter-spacing:.25em;margin:5px 0}header small,.right small{color:var(--muted)}.right{text-align:right}.right b{display:block;color:var(--accent);margin-top:5px}
main{display:grid;grid-template-columns:210px 1fr 210px;gap:20px;align-items:center}aside{color:var(--muted);font-size:11px;line-height:1.7}aside p{border-left:1px solid var(--line);padding-left:12px;margin:24px 0}aside b{color:var(--accent);font-weight:normal}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:660px;justify-content:center}
.cosmos{width:390px;height:390px;position:relative;display:grid;place-items:center}.ring{position:absolute;border:1px solid rgba(140,200,255,.48);border-radius:50%}.r1{width:355px;height:355px;animation:spin 32s linear infinite}.r2{width:280px;height:280px;border-style:dashed;animation:spinR 22s linear infinite}.r3{width:205px;height:205px;animation:spin 15s linear infinite}.core{width:94px;height:94px;border-radius:50%;background:radial-gradient(circle,#fff 0,#aee6ff 22%,rgba(65,140,255,.7) 48%,transparent 74%);filter:drop-shadow(0 0 22px #64bfff);animation:pulse 3.2s ease-in-out infinite}
.center>small{letter-spacing:.28em;color:var(--muted)}.center>h1{letter-spacing:.16em;font-weight:400;margin:10px 0 6px}.center>p{color:var(--accent);letter-spacing:.15em;font-size:12px;margin:0}
.status{display:grid;grid-template-columns:repeat(3,1fr);width:min(650px,92vw);margin-top:22px;border:1px solid var(--line);background:rgba(3,9,20,.58)}.status div{padding:14px;border-right:1px solid var(--line)}.status div:last-child{border-right:0}.status small{display:block;color:var(--muted);font-size:9px}.status b{display:block;color:var(--ok);margin-top:6px;font-size:12px;font-weight:normal}
.panel{width:min(760px,92vw);margin-top:16px;padding:18px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(9px)}.row{display:flex;gap:8px}input{flex:1;background:#02060e;border:1px solid rgba(140,200,255,.5);color:var(--text);padding:12px;text-transform:uppercase}button{background:#09172d;color:var(--accent);border:1px solid rgba(140,200,255,.5);padding:12px 14px;cursor:pointer;font:inherit}button:hover{border-color:var(--accent);color:#fff}.wide{width:100%;margin-top:10px}.hidden{display:none!important}.timer{font-size:54px;color:var(--bad);margin:5px 0 15px}.timelineGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.timelineGrid button small{display:block;color:var(--muted);margin-top:5px}
body.cascade .core{background:radial-gradient(circle,#fff 0,#ffbac2 22%,rgba(255,65,92,.7) 48%,transparent 74%);filter:drop-shadow(0 0 25px #ff5368)}body.cascade .ring{border-color:rgba(255,90,110,.55)}
.master{padding:40px 20px}.masterWrap{width:min(900px,100%);margin:auto;position:relative;z-index:1}.masterGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.masterGrid button{min-height:58px}.master label{display:block;color:var(--muted);font-size:10px;margin:12px 0 6px}.master input{width:100%}.danger{color:var(--bad);border-color:rgba(255,107,122,.6)}.success{color:var(--ok);border-color:rgba(165,255,214,.6)}a{color:var(--accent)}.key{max-width:560px;margin:10vh auto;text-align:center}.mini{border:1px solid var(--line);padding:14px;margin:20px auto;width:220px}.mini small{display:block;color:var(--muted)}.mini b{color:var(--accent)}.dangerText{color:var(--bad)}.successText{color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}@keyframes pulse{0%,100%{transform:scale(.95)}50%{transform:scale(1.08)}}
@media(max-width:900px){main{grid-template-columns:1fr}aside{display:none}.timelineGrid{grid-template-columns:repeat(2,1fr)}.cosmos{width:310px;height:310px}.r1{width:290px;height:290px}.r2{width:230px;height:230px}.r3{width:170px;height:170px}.masterGrid{grid-template-columns:1fr}}
</style></head><body class="master"><div class="masterWrap"><small>KEEPER ACCESS</small><h1>MASTER CONTROL</h1><div class="panel"><small>CURRENT STATE</small><h2 id="stateNow">WELCOME</h2></div><div class="masterGrid"><button data-state="WELCOME">WELCOME</button><button data-state="PHASE1">START PHASE I</button><button data-state="PHASE1_COMPLETE">PHASE I COMPLETE</button><button data-state="PHASE2">START PHASE II</button><button data-state="CLEARED">COMPLETE PHASE II</button><button data-state="PROVISIONAL">PROVISIONAL ANCHOR</button><button data-state="CASCADE" class="danger">ACTIVATE CASCADE</button><button data-state="RESOLVED" class="success">RESOLVE</button></div><div class="panel"><label>PHASE I CODE</label><input id="p1"><label>PHASE II CODE</label><input id="p2"><label>FINAL OVERRIDE COMMAND</label><input id="final"><label>CASCADE MINUTES</label><input id="minutes" type="number" min="1" max="60"><button id="save" class="wide">SAVE SETTINGS</button><p id="saved"></p></div><div class="panel"><button id="reset" class="wide danger">RESET LOCAL GAME STATE</button></div><p><a href="index.html">Open Control Station</a></p></div><script>const C={defaultState:"WELCOME",phase1Code:"AR-4721",phase2Code:"NOVA-2974",finalCommand:"STABILIZE ALL TIMELINES",cascadeMinutes:10};</script><script>
const $=id=>document.getElementById(id);function refresh(){let s=localStorage.getItem("convergenceState")||C.defaultState;$("stateNow").textContent=s;$("p1").value=localStorage.getItem("phase1Code")||C.phase1Code;$("p2").value=localStorage.getItem("phase2Code")||C.phase2Code;$("final").value=localStorage.getItem("finalCommand")||C.finalCommand;$("minutes").value=localStorage.getItem("timerMinutes")||C.cascadeMinutes}
document.querySelectorAll("[data-state]").forEach(b=>b.onclick=()=>{let s=b.dataset.state;localStorage.setItem("convergenceState",s);if(s==="CASCADE")localStorage.setItem("cascadeStart",Date.now());if(s==="WELCOME"||s==="RESOLVED")localStorage.removeItem("cascadeStart");refresh()});
$("save").onclick=()=>{localStorage.setItem("phase1Code",$("p1").value.trim());localStorage.setItem("phase2Code",$("p2").value.trim());localStorage.setItem("finalCommand",$("final").value.trim());localStorage.setItem("timerMinutes",$("minutes").value);$("saved").textContent="SETTINGS SAVED."};
$("reset").onclick=()=>{["convergenceState","phase1Code","phase2Code","finalCommand","timerMinutes","cascadeStart"].forEach(k=>localStorage.removeItem(k));refresh()};refresh();
</script></body></html>
